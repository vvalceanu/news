<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nachrichten{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 0 auto; padding: 1rem; line-height: 1.5; }
    ul { list-style: none; padding: 0; }
    li { margin-bottom: 1rem; }
    .meta { color: #666; font-size: 0.875rem; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f5f5f5; padding: 1rem; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
